services:
  postgres:
    build: ./db
    environment:
      POSTGRES_USER: retriv
      POSTGRES_PASSWORD: retriv
      POSTGRES_DB: retriv
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retriv"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Full-docker workflow only: `docker compose --profile full up`.
  # Ollama still runs on the host and is reached via host.docker.internal.
  api:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://retriv:retriv@postgres:5432/retriv?sslmode=disable
      OLLAMA_URL: http://host.docker.internal:11434
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
